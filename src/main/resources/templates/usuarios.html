<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca | Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --ink: #17324d; --aqua: #0c8d87; --paper: #f4f7f6; --accent: #e5a93f; }
        body { background: var(--paper); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
        .navbar { background: var(--ink); }
        .brand-mark { color: var(--accent); font-weight: 700; letter-spacing: 1px; }
        .page-header { border-bottom: 3px solid var(--accent); }
        .panel { background: #fff; border: 1px solid #d9e1df; border-radius: 6px; box-shadow: 0 8px 20px rgb(23 50 77 / 8%); }
        .table thead th { color: #fff; background: var(--ink); white-space: nowrap; }
        .btn-primary { background: var(--aqua); border-color: var(--aqua); }
        .btn-primary:hover { background: #08736e; border-color: #08736e; }
        .form-control:focus { border-color: var(--aqua); box-shadow: 0 0 0 .2rem rgb(12 141 135 / 18%); }
        @media (max-width: 767px) { .table { font-size: .86rem; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand brand-mark" th:href="@{/vista/libros}">BIBLIOTECA</a>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active fw-bold text-white" th:href="@{/vista/usuarios}">Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/vista/libros}">Libros</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" th:href="@{/vista/prestamos}">Préstamos</a>
                    </li>
                </ul>
        </div>
    </nav>

    <main class="container pb-5">
        <header class="page-header d-flex justify-content-between align-items-end mb-4 pb-3">
            <div>
                <p class="text-uppercase small mb-1 text-secondary">Administración</p>
                <h1 class="h2 mb-0">Usuarios</h1>
            </div>
            <span class="badge text-bg-light border" th:text="${usuarios != null ? #lists.size(usuarios) : 0} + ' registrados'">0 registrados</span>
        </header>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensaje}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${error}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="panel p-4">
                    <h2 class="h5 mb-3">Registrar nuevo usuario</h2>
                    <form th:action="@{/vista/usuarios/guardar}" th:object="${usuario}" method="post">
                        <div class="mb-3"><label class="form-label" for="nombre">Nombre(s): </label><input id="nombre" type="text" class="form-control" th:field="*{nombre}" required></div>
                        <div class="mb-3"><label class="form-label" for="apellidos">Apellidos: </label><input id="apellidos" type="text" class="form-control" th:field="*{apellidos}" required></div>
                        <div class="mb-3"><label class="form-label" for="correo">Correo: </label><input id="correo" type="email" class="form-control" th:field="*{correo}" required></div>
                        <div class="mb-3"><label class="form-label" for="contrasena">Contraseña: </label><input id="contrasena" type="password" class="form-control" th:field="*{contrasena}" required></div>
                        <div class="mb-3"><label class="form-label" for="rol">Rol: </label><select id="rol" class="form-select" th:field="*{rol}" required><option value="" disabled selected>Selecciona un rol...</option><option value="ADMIN">Administrador</option><option value="BIBLIOTECARIO">Bibliotecario</option><option value="LECTOR">Lector</option></select></div>
                        <div class="mb-3"><label class="form-label" for="direccion">Dirección: </label><input id="direccion" type="text" class="form-control" th:field="*{direccion}"></div>
                        <div class="mb-3"><label class="form-label" for="estado">Estado: </label><select id="estado" class="form-select" th:field="*{estado}" required><option value="" disabled selected>Selecciona un estado...</option><option value="ACTIVO">Activo</option><option value="INACTIVO">Inactivo</option><option value="SUSPENDIDO">Suspendido</option></select></div>
                        <div class="mb-3"><label class="form-label" for="fechaNacimiento">Fecha de nacimiento: </label><input id="fechaNacimiento" type="date" class="form-control" th:field="*{fechaNacimiento}" required></div>
                        <div class="mb-3"><label class="form-label" for="telefono">Teléfono: </label><input id="telefono" type="tel" pattern="^\+?[1-9]\d{1,14}$" placeholder="+522291234567" class="form-control" th:field="*{telefono}" required></div>

                        <button class="btn btn-primary w-100" type="submit">Guardar Usuario</button>
                    </form>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="panel p-3 p-md-4">
                    <div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 mb-0">Lista de Usuarios</h2><input id="buscador" class="form-control form-control-sm w-auto" type="search" placeholder="Buscar por nombre, correo o rol"></div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaUsuarios">
                            <thead><tr><th>ID</th><th>Nombre</th><th>Apellidos</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Creación</th><th>Nacimiento</th><th>Teléfono</th><th>Dirección</th><th class="text-end">Acciones</th></tr></thead>
                            <tbody>
                                <tr th:each="item : ${usuarios}">
                                    <td th:text="${item.id}"></td><td th:text="${item.nombre}"></td><td th:text="${item.apellidos}"></td><td th:text="${item.correo}"></td>
                                    <td><span class="badge text-bg-secondary" th:text="${item.rol != null ? item.rol.name() : 'SIN ROL'}"></span></td>
                                    <td>
                                        <span th:if="${item.estado?.name() == 'ACTIVO'}" class="badge text-bg-success">Activo</span>
                                        <span th:if="${item.estado?.name() == 'INACTIVO'}" class="badge text-bg-warning">Inactivo</span>
                                        <span th:if="${item.estado?.name() == 'SUSPENDIDO'}" class="badge text-bg-danger">Suspendido</span>
                                        <span th:if="${item.estado == null}" class="badge text-bg-light border">Desconocido</span>
                                    </td>
                                    <td th:text="${item.fechaCreacion != null ? #temporals.format(item.fechaCreacion, 'dd/MM/yyyy HH:mm') : ''}"></td><td th:text="${item.fechaNacimiento != null ? #temporals.format(item.fechaNacimiento, 'dd/MM/yyyy') : ''}"></td><td th:text="${item.telefono}"></td><td th:text="${item.direccion}"></td>
                                    <td class="text-end text-nowrap">
                                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" th:data-bs-target="'#editar-' + ${item.id}">Editar</button>
                                        <form class="d-inline" th:action="@{/vista/usuarios/{id}/eliminar(id=${item.id})}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit" onclick="return confirm('Eliminar este usuario?')">Eliminar</button></form>
                                    </td>
                                    <div class="modal fade" th:id="'editar-' + ${item.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog"><div class="modal-content"><form th:action="@{/vista/usuarios/{id}/actualizar(id=${item.id})}" method="post">
                                            <div class="modal-header"><h3 class="modal-title fs-5">Editar Usuario</h3><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                                                <div class="modal-body">
                                                    <div class="mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control" name="nombre" th:value="${item.nombre}" required></div>
                                                    <div class="mb-3"><label class="form-label">Apellidos</label><input type="text" class="form-control" name="apellidos" th:value="${item.apellidos}" required></div>
                                                    <div class="mb-3"><label class="form-label">Correo</label><input type="email" class="form-control" name="correo" th:value="${item.correo}" required></div>
                                                    <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control" name="contrasena" th:value="${item.contrasena}" required></div>
                                                    <div class="mb-3"><label class="form-label">Rol</label><select class="form-select" name="rol" required><option value="" disabled th:selected="${item.rol == null}">Selecciona un rol...</option><option value="ADMIN" th:selected="${item.rol?.name() == 'ADMIN'}">Administrador</option><option value="BIBLIOTECARIO" th:selected="${item.rol?.name() == 'BIBLIOTECARIO'}">Bibliotecario</option><option value="LECTOR" th:selected="${item.rol?.name() == 'LECTOR'}">Lector</option></select></div>
                                                    <div class="mb-3"><label class="form-label">Estado</label><select class="form-select" name="estado" required><option value="" disabled th:selected="${item.estado == null}">Selecciona un estado...</option><option value="ACTIVO" th:selected="${item.estado?.name() == 'ACTIVO'}">Activo</option><option value="INACTIVO" th:selected="${item.estado?.name() == 'INACTIVO'}">Inactivo</option><option value="SUSPENDIDO" th:selected="${item.estado?.name() == 'SUSPENDIDO'}">Suspendido</option></select></div>
                                                    <div class="mb-3"><label class="form-label">Fecha Nacimiento</label><input type="date" class="form-control" name="fechaNacimiento" th:value="${item.fechaNacimiento}" required></div>
                                                    <div class="mb-3"><label class="form-label">Teléfono</label><input type="tel" pattern="^\+?[1-9]\d{1,14}$" placeholder="+522291234567" class="form-control" name="telefono" th:value="${item.telefono}" required></div>
                                                    <div class="mb-3"><label class="form-label">Dirección</label><input type="text" class="form-control" name="direccion" th:value="${item.direccion}"></div>
                                                </div>
                                            <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary" type="submit">Guardar cambios</button></div>
                                        </form></div></div>
                                    </div>
                                </tr>
                                <tr th:if="${usuarios == null or #lists.isEmpty(usuarios)}"><td colspan="11" class="text-center text-secondary py-4">No hay usuarios registrados.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('buscador').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            document.querySelectorAll('#tablaUsuarios tbody tr').forEach(function (row) {
                row.style.display = row.textContent.toLowerCase().includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
